<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TengRAG - 知识库问答</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --card: #1c2129; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --green: #3fb950; --orange: #d29922;
    --mono: 'SFMono-Regular', Consolas, Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand b { font-size: 16px; }
  .brand span { color: var(--dim); font-size: 12px; }
  .stats { font-size: 12px; color: var(--dim); font-family: var(--mono); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  .chat { display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 86%; margin-bottom: 14px; padding: 12px 16px; border-radius: 12px;
         font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .user { margin-left: auto; background: #1f6feb; color: #fff; border-bottom-right-radius: 4px; }
  .ai { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .sources { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border);
             font-size: 12px; color: var(--dim); }
  .sources b { color: var(--orange); font-weight: 600; }
  .usage { margin-top: 8px; font-size: 11px; color: var(--dim); font-family: var(--mono); }
  .input { display: flex; gap: 10px; padding: 14px 22px; background: var(--panel); border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
             color: var(--text); padding: 10px 14px; font-size: 14px; font-family: inherit; }
  textarea:focus { outline: none; border-color: var(--accent); }
  button { border: none; border-radius: 10px; padding: 0 24px; font-size: 14px; cursor: pointer; color: #fff; background: #1f6feb; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  aside { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  aside h3 { font-size: 13px; padding: 14px 16px 8px; color: var(--dim); font-weight: 600; }
  #docs { flex: 1; overflow-y: auto; padding: 0 12px; }
  .doc { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
         padding: 10px 12px; margin-bottom: 8px; font-size: 12px; }
  .doc .name { color: var(--text); font-weight: 600; word-break: break-all; }
  .doc .meta { color: var(--dim); margin-top: 4px; font-family: var(--mono); font-size: 11px; }
  .doc button { background: transparent; color: var(--red, #f85149); border: 1px solid var(--border);
                padding: 2px 8px; font-size: 11px; border-radius: 6px; margin-top: 6px; }
  .upload { padding: 12px 16px; border-top: 1px solid var(--border); }
  .upload label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .upload input { width: 100%; font-size: 12px; color: var(--dim); }
  .hint { font-size: 11px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
  .caret { display: inline-block; width: 7px; height: 14px; background: var(--accent);
           vertical-align: text-bottom; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <div class="brand"><b>📚 TengRAG</b><span>知识库问答 · Spring Boot + LangChain4j + BGE-zh</span></div>
  <div class="stats" id="stats">docs: 0</div>
</header>

<main>
  <section class="chat">
    <div id="log">
      <div class="msg ai">上传左侧文档，然后向知识库提问。回答会带 <b style="color:#d29922">来源引用</b>，流式输出。</div>
    </div>
    <div class="input">
      <textarea id="q" rows="2" placeholder="Enter 提问，Shift+Enter 换行"></textarea>
      <button id="send" onclick="ask()">提问</button>
    </div>
  </section>

  <aside>
    <h3>知识库文档</h3>
    <div id="docs"></div>
    <div class="upload">
      <label>上传 .txt / .md / .pdf</label>
      <input type="file" id="file" accept=".txt,.md,.pdf" onchange="upload()">
      <div class="hint">上传后自动完成：解析 → 切分 → 中文嵌入（BGE 本地 ONNX）→ 入向量库</div>
    </div>
  </aside>
</main>

<script>
const log = document.getElementById('log');
const q = document.getElementById('q');
const sendBtn = document.getElementById('send');

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});

function addMsg(cls, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function upload() {
  const file = document.getElementById('file').files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/api/documents', { method: 'POST', body: fd });
    const body = await r.json();
    if (!r.ok) { alert(body.message || '上传失败'); return; }
    document.getElementById('file').value = '';
    await refreshDocs();
    addMsg('ai', '✅ 已入库：<b>' + body.name + '</b>（切成 ' + body.chunkCount + ' 个向量块）');
  } catch (e) { alert('上传失败: ' + e); }
}

async function refreshDocs() {
  const docs = await (await fetch('/api/documents')).json();
  document.getElementById('stats').textContent = 'docs: ' + docs.length;
  const box = document.getElementById('docs');
  box.innerHTML = docs.length ? '' : '<div class="hint" style="padding:8px">还没有文档，先上传一个。</div>';
  for (const d of docs) {
    const div = document.createElement('div');
    div.className = 'doc';
    div.innerHTML = '<div class="name">' + d.name + '</div>' +
      '<div class="meta">' + d.chunkCount + ' chunks · ' + (d.sizeBytes/1024).toFixed(1) + ' KB</div>' +
      '<button onclick="removeDoc(\'' + d.id + '\')">删除</button>';
    box.appendChild(div);
  }
}

async function removeDoc(id) {
  await fetch('/api/documents/' + id, { method: 'DELETE' });
  await refreshDocs();
}

async function ask() {
  const question = q.value.trim();
  if (!question || sendBtn.disabled) return;
  q.value = '';
  sendBtn.disabled = true;
  addMsg('user', escapeHtml(question));

  const aiDiv = addMsg('ai', '');
  let answerText = '';
  let sourcesHtml = '';
  let usageHtml = '';
  let retrievalMs = null;

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const frame = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        handleFrame(frame);
      }
    }
  } catch (e) {
    answerText += '\n⚠️ 连接失败: ' + e;
  }

  function handleFrame(frame) {
    let event = 'message', data = '';
    for (const line of frame.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    }
    let d = {};
    try { d = JSON.parse(data); } catch { return; }

    if (event === 'sources' && d.items && d.items.length) {
      sourcesHtml = '<div class="sources"><b>引用来源：</b><br>' +
        d.items.map((s, i) => '[' + (i+1) + '] ' + escapeHtml(s.docName) +
          ' <span style="opacity:.6">(' + s.score.toFixed(3) + ')</span>').join('<br>') + '</div>';
    } else if (event === 'token') {
      answerText += d.text;
      aiDiv.innerHTML = escapeHtml(answerText) + '<span class="caret"></span>' + sourcesHtml;
      log.scrollTop = log.scrollHeight;
    } else if (event === 'retrieval') {
      retrievalMs = d.latencyMs;
    } else if (event === 'usage') {
      usageHtml = '<div class="usage">' + d.promptTokens + '↑ / ' + d.completionTokens +
        '↓ tokens · ' + d.latencyMs + 'ms' + (retrievalMs != null ? ' · 检索 ' + retrievalMs + 'ms' : '') + '</div>';
    } else if (event === 'error') {
      answerText = '❌ ' + (d.message || '未知错误');
    } else if (event === 'done') {
      aiDiv.innerHTML = renderMarkdown(answerText) + sourcesHtml + usageHtml;
      log.scrollTop = log.scrollHeight;
    }
  }

  sendBtn.disabled = false;
}

function escapeHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 极简 markdown：粗体 / 行内代码 / 换行（回答以纯文本+简单标记为主）
function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  html = html.replace(/`([^`]+)`/g, '<code style="font-family:var(--mono);background:#21262d;padding:1px 5px;border-radius:4px">$1</code>');
  return html;
}

refreshDocs();
</script>
</body>
</html>
